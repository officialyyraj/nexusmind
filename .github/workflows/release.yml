name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "MAJOR=$(echo $VERSION | cut -d. -f1)" >> $GITHUB_OUTPUT
          echo "MINOR=$(echo $VERSION | cut -d. -f2)" >> $GITHUB_OUTPUT
          echo "PATCH=$(echo $VERSION | cut -d. -f3)" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          # Generate changelog from commits since last tag
          CHANGELOG=$(git log --no-merges --oneline --pretty=format:"%h %s" $(git describe --tags --abbrev=0)..HEAD 2>/dev/null || echo "Initial release")
          
          # Create a proper changelog format
          cat > CHANGELOG.md << 'CHANGELOG_EOF'
          # Changelog
          
          All notable changes to this project will be documented in this file.
          
          ## [${{ steps.version.outputs.VERSION }}]
          
          ### Features
          - (Add new features here)
          
          ### Bug Fixes
          - (Add bug fixes here)
          
          ### Breaking Changes
          - (Add breaking changes here)
          
          ### Other Changes
          - (Add other changes here)
          
          CHANGELOG_EOF
          
          echo "changelog_file=CHANGELOG.md" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body_path: ${{ steps.changelog.outputs.changelog_file }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'alpha') || contains(steps.version.outputs.VERSION, 'beta') || contains(steps.version.outputs.VERSION, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: nexusmind/backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: nexusmind/frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Create production deployment file
        run: |
          cat > deployment-${{ steps.version.outputs.VERSION }}.yaml << 'EOF'
          # NexusMind v${{ steps.version.outputs.VERSION }} Deployment
          
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nexusmind-backend
            labels:
              app: nexusmind
              component: backend
              version: ${{ steps.version.outputs.VERSION }}
          spec:
            replicas: 3
            selector:
              matchLabels:
                app: nexusmind
                component: backend
            template:
              metadata:
                labels:
                  app: nexusmind
                  component: backend
                  version: ${{ steps.version.outputs.VERSION }}
              spec:
                containers:
                - name: backend
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.version.outputs.VERSION }}
                  ports:
                  - containerPort: 8000
                  env:
                  - name: DATABASE_URL
                    valueFrom:
                      secretKeyRef:
                        name: nexusmind-secrets
                        key: database-url
                  - name: REDIS_URL
                    valueFrom:
                      configMapKeyRef:
                        name: nexusmind-config
                        key: redis-url
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nexusmind-frontend
            labels:
              app: nexusmind
              component: frontend
              version: ${{ steps.version.outputs.VERSION }}
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: nexusmind
                component: frontend
            template:
              metadata:
                labels:
                  app: nexusmind
                  component: frontend
                  version: ${{ steps.version.outputs.VERSION }}
              spec:
                containers:
                - name: frontend
                  image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:${{ steps.version.outputs.VERSION }}
                  ports:
                  - containerPort: 3000
          EOF

      - name: Upload deployment files
        uses: actions/upload-artifact@v4
        with:
          name: deployment-files-${{ steps.version.outputs.VERSION }}
          path: |
            deployment-${{ steps.version.outputs.VERSION }}.yaml
            CHANGELOG.md
          retention-days: 90
