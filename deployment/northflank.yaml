{
  "$schema": "https://api.northflank.com/v1/schemas/template",
  "apiVersion": "v1.2",
  "arguments": {
    "SECRET_KEY": {
      "description": "Application secret key for JWT and session encryption",
      "required": true
    },
    "SESSION_SECRET": {
      "description": "Session encryption secret",
      "required": true
    },
    "LOG_LEVEL": {
      "description": "Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)",
      "default": "INFO"
    },
    "CORS_ORIGINS": {
      "description": "Comma-separated list of allowed CORS origins",
      "default": "https://your-domain.com"
    },
    "OLLAMA_BASE_URL": {
      "description": "Ollama API base URL (optional)",
      "default": "http://localhost:11434"
    },
    "GITHUB_REPO": {
      "description": "GitHub repository URL",
      "default": "https://github.com/officialyyraj/nexusmind"
    },
    "BRANCH": {
      "description": "Branch to deploy from",
      "default": "master"
    }
  },
  "spec": {
    "kind": "Workflow",
    "spec": {
      "type": "sequential",
      "steps": [
        {
          "kind": "Project",
          "ref": "project",
          "spec": {
            "name": "nexusmind",
            "region": "europe-west",
            "networking": {
              "allowedIngressProjects": []
            }
          }
        },
        {
          "kind": "Workflow",
          "spec": {
            "type": "sequential",
            "context": {
              "projectId": "${refs.project.id}"
            },
            "steps": [
              {
                "kind": "Addon",
                "ref": "postgres",
                "spec": {
                  "name": "postgres",
                  "type": "postgres-15",
                  "version": "15",
                  "billing": {
                    "deploymentPlan": "nf-starter-5",
                    "storage": 10240,
                    "replicas": 1
                  }
                }
              },
              {
                "kind": "Addon",
                "ref": "redis",
                "spec": {
                  "name": "redis",
                  "type": "redis-7",
                  "version": "7",
                  "billing": {
                    "deploymentPlan": "nf-starter-5",
                    "storage": 1024,
                    "replicas": 1
                  }
                }
              },
              {
                "kind": "DeploymentService",
                "ref": "chromadb",
                "spec": {
                  "name": "chromadb",
                  "billing": {
                    "deploymentPlan": "nf-compute-20"
                  },
                  "deployment": {
                    "instances": 1,
                    "external": {
                      "imagePath": "ghcr.io/chroma-core/chroma:0.4.22"
                    },
                    "storage": {
                      "usePdSsdStorage": true,
                      "ephemeralStorage": {
                        "storageSize": 5120
                      }
                    }
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 8000,
                      "public": false,
                      "protocol": "HTTP",
                      "security": {
                        "credentials": [],
                        "policies": [],
                        "sso": {}
                      }
                    }
                  ],
                  "runtimeEnvironment": {}
                }
              },
              {
                "kind": "CombinedService",
                "ref": "backend",
                "spec": {
                  "name": "backend",
                  "billing": {
                    "deploymentPlan": "nf-compute-20",
                    "buildPlan": "nf-build-10"
                  },
                  "deployment": {
                    "instances": 1,
                    "storage": {
                      "usePdSsdStorage": true,
                      "ephemeralStorage": {
                        "storageSize": 1024
                      }
                    }
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 8000,
                      "public": false,
                      "protocol": "HTTP",
                      "security": {
                        "credentials": [],
                        "policies": [],
                        "sso": {}
                      }
                    }
                  ],
                  "buildSource": "git",
                  "vcsData": {
                    "projectUrl": "${args.GITHUB_REPO}",
                    "projectType": "github",
                    "projectBranch": "${args.BRANCH}"
                  },
                  "buildSettings": {
                    "dockerfile": {
                      "dockerFilePath": "/nexusmind/backend/Dockerfile",
                      "dockerWorkDir": "/nexusmind/backend"
                    }
                  },
                  "buildConfiguration": {},
                  "buildArguments": {
                    "ENVIRONMENT": "production"
                  },
                  "disabledCI": false,
                  "runtimeEnvironment": {}
                }
              },
              {
                "kind": "CombinedService",
                "ref": "frontend",
                "spec": {
                  "name": "frontend",
                  "billing": {
                    "deploymentPlan": "nf-compute-20",
                    "buildPlan": "nf-build-10"
                  },
                  "deployment": {
                    "instances": 1,
                    "storage": {
                      "usePdSsdStorage": true,
                      "ephemeralStorage": {
                        "storageSize": 1024
                      }
                    }
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 3000,
                      "public": true,
                      "protocol": "HTTP",
                      "security": {
                        "credentials": [],
                        "policies": [],
                        "sso": {}
                      }
                    }
                  ],
                  "buildSource": "git",
                  "vcsData": {
                    "projectUrl": "${args.GITHUB_REPO}",
                    "projectType": "github",
                    "projectBranch": "${args.BRANCH}"
                  },
                  "buildSettings": {
                    "dockerfile": {
                      "dockerFilePath": "/nexusmind/frontend/Dockerfile",
                      "dockerWorkDir": "/nexusmind/frontend"
                    }
                  },
                  "buildConfiguration": {},
                  "buildArguments": {
                    "NEXT_PUBLIC_API_URL": "http://backend:8000/api/v1",
                    "NEXT_PUBLIC_WS_URL": "ws://backend:8000"
                  },
                  "disabledCI": false,
                  "runtimeEnvironment": {}
                }
              }
            ]
          }
        }
      ]
    }
  },
  "options": {
    "autorun": false,
    "concurrencyPolicy": "allow"
  },
  "gitops": {
    "repoUrl": "https://github.com/officialyyraj/nexusmind",
    "vcsService": "github",
    "accountLogin": "officialyyraj",
    "branch": "master",
    "filePath": "/northflank.yaml"
  }
}