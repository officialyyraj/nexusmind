version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexusmind-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/nexusmind
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      - CORS_ORIGINS=http://localhost:3000,http://frontend:3000
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - sandbox-data:/app/workspace
    networks:
      - nexusmind

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexusmind-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://backend:8000
    depends_on:
      - backend
    networks:
      - nexusmind

  db:
    image: postgres:15-alpine
    container_name: nexusmind-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nexusmind
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - nexusmind

  redis:
    image: redis:7-alpine
    container_name: nexusmind-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - nexusmind

volumes:
  postgres-data:
  redis-data:
  sandbox-data:

networks:
  nexusmind:
    driver: bridge