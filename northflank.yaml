{
  "$schema": "https://api.northflank.com/v1/schemas/template",
  "apiVersion": "v1.2",
  "name": "nexusmind",
  "description": "NexusMind deployment on Northflank",
  "arguments": {
    "SECRET_KEY": {
      "description": "Application secret key for JWT and session encryption",
      "required": true
    },
    "SESSION_SECRET": {
      "description": "Session encryption secret",
      "required": true
    },
    "LOG_LEVEL": {
      "description": "Logging level (DEBUG, INFO, WARNING, ERROR, CRITICAL)",
      "default": "INFO"
    },
    "CORS_ORIGINS": {
      "description": "Comma-separated list of allowed CORS origins",
      "default": "https://your-domain.com"
    },
    "OLLAMA_BASE_URL": {
      "description": "Ollama API base URL (optional)",
      "default": "http://localhost:11434"
    },
    "GITHUB_REPO": {
      "description": "GitHub repository URL",
      "default": "https://github.com/officialyyraj/nexusmind"
    },
    "BRANCH": {
      "description": "Branch to deploy from",
      "default": "master"
    }
  },
  "argumentOverrides": {
    "SECRET_KEY": "${secret.SECRET_KEY}",
    "SESSION_SECRET": "${secret.SESSION_SECRET}"
  },
  "spec": {
    "kind": "Workflow",
    "spec": {
      "type": "sequential",
      "steps": [
        {
          "kind": "Project",
          "ref": "project",
          "spec": {
            "name": "nexusmind",
            "region": "europe-west",
            "networking": {
              "allowedIngressProjects": []
            }
          }
        },
        {
          "kind": "Workflow",
          "spec": {
            "type": "sequential",
            "context": {
              "projectId": "${refs.project.id}"
            },
            "steps": [
              {
                "kind": "Addon",
                "ref": "postgres",
                "spec": {
                  "name": "postgres",
                  "type": "postgres-15",
                  "version": "15",
                  "billing": {
                    "deploymentPlan": "nf-starter-5"
                  }
                }
              },
              {
                "kind": "Addon",
                "ref": "redis",
                "spec": {
                  "name": "redis",
                  "type": "redis-7",
                  "version": "7",
                  "billing": {
                    "deploymentPlan": "nf-starter-5"
                  }
                }
              },
              {
                "kind": "DeploymentService",
                "ref": "chromadb",
                "spec": {
                  "name": "chromadb",
                  "billing": {
                    "deploymentPlan": "nf-compute-20"
                  },
                  "deployment": {
                    "instances": 1,
                    "external": {
                      "imagePath": "ghcr.io/chroma-core/chroma:0.4.22"
                    },
                    "storage": {
                      "volumes": [
                        {
                          "name": "chromadb-data",
                          "mountPath": "/data/chromadb",
                          "size": "5Gi"
                        }
                      ]
                    }
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 8000,
                      "public": false
                    }
                  ],
                  "env": [
                    {
                      "key": "IS_PERSISTENT",
                      "value": "TRUE"
                    },
                    {
                      "key": "ANONYMIZED_TELEMETRY",
                      "value": "FALSE"
                    }
                  ],
                  "healthCheck": {
                    "http": {
                      "path": "/api/v1/heartbeat"
                    }
                  }
                }
              },
              {
                "kind": "CombinedService",
                "ref": "backend",
                "spec": {
                  "name": "backend",
                  "billing": {
                    "deploymentPlan": "nf-compute-20",
                    "buildPlan": "nf-build-10"
                  },
                  "deployment": {
                    "instances": 1,
                    "storage": {
                      "volumes": [
                        {
                          "name": "workspace",
                          "mountPath": "/app/workspace",
                          "size": "10Gi"
                        },
                        {
                          "name": "plugins",
                          "mountPath": "/app/plugins",
                          "size": "2Gi"
                        }
                      ]
                    }
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 8000,
                      "public": false
                    }
                  ],
                  "env": [
                    {
                      "key": "ENVIRONMENT",
                      "value": "production"
                    },
                    {
                      "key": "DATABASE_URL",
                      "value": "${refs.postgres.connectionString}"
                    },
                    {
                      "key": "REDIS_URL",
                      "value": "${refs.redis.connectionString}"
                    },
                    {
                      "key": "CHROMADB_URL",
                      "value": "http://chromadb:8000"
                    },
                    {
                      "key": "SECRET_KEY",
                      "value": "${args.SECRET_KEY}"
                    },
                    {
                      "key": "SESSION_SECRET",
                      "value": "${args.SESSION_SECRET}"
                    },
                    {
                      "key": "LOG_LEVEL",
                      "value": "${args.LOG_LEVEL}"
                    },
                    {
                      "key": "CORS_ORIGINS",
                      "value": "${args.CORS_ORIGINS}"
                    },
                    {
                      "key": "API_PREFIX",
                      "value": "/api/v1"
                    },
                    {
                      "key": "OLLAMA_BASE_URL",
                      "value": "${args.OLLAMA_BASE_URL}"
                    },
                    {
                      "key": "SANDBOX_TIMEOUT_SECONDS",
                      "value": "300"
                    },
                    {
                      "key": "WORKSPACE_ROOT",
                      "value": "/app/workspace"
                    },
                    {
                      "key": "PLUGINS_DIRECTORY",
                      "value": "/app/plugins"
                    }
                  ],
                  "healthCheck": {
                    "http": {
                      "path": "/health/live"
                    }
                  },
                  "buildSource": "git",
                  "vcsData": {
                    "projectUrl": "${args.GITHUB_REPO}",
                    "projectType": "github",
                    "projectBranch": "${args.BRANCH}"
                  },
                  "buildSettings": {
                    "dockerfile": {
                      "dockerFilePath": "/nexusmind/backend/Dockerfile",
                      "dockerWorkDir": "/nexusmind/backend"
                    }
                  },
                  "buildConfiguration": {
                    "branchRestrictions": ["${args.BRANCH}"]
                  },
                  "buildArguments": {
                    "ENVIRONMENT": "production"
                  },
                  "waitForConditions": [
                    {
                      "addonRef": "postgres",
                      "condition": "running"
                    },
                    {
                      "addonRef": "redis",
                      "condition": "running"
                    },
                    {
                      "serviceRef": "chromadb",
                      "condition": "running"
                    }
                  ]
                }
              },
              {
                "kind": "CombinedService",
                "ref": "frontend",
                "spec": {
                  "name": "frontend",
                  "billing": {
                    "deploymentPlan": "nf-compute-20",
                    "buildPlan": "nf-build-10"
                  },
                  "deployment": {
                    "instances": 1
                  },
                  "ports": [
                    {
                      "name": "http",
                      "internalPort": 3000,
                      "public": true
                    }
                  ],
                  "env": [
                    {
                      "key": "NODE_ENV",
                      "value": "production"
                    },
                    {
                      "key": "NEXT_TELEMETRY_DISABLED",
                      "value": "1"
                    }
                  ],
                  "healthCheck": {
                    "http": {
                      "path": "/"
                    }
                  },
                  "buildSource": "git",
                  "vcsData": {
                    "projectUrl": "${args.GITHUB_REPO}",
                    "projectType": "github",
                    "projectBranch": "${args.BRANCH}"
                  },
                  "buildSettings": {
                    "dockerfile": {
                      "dockerFilePath": "/nexusmind/frontend/Dockerfile",
                      "dockerWorkDir": "/nexusmind/frontend"
                    }
                  },
                  "buildConfiguration": {
                    "branchRestrictions": ["${args.BRANCH}"]
                  },
                  "buildArguments": {
                    "NEXT_PUBLIC_API_URL": "http://backend:8000/api/v1",
                    "NEXT_PUBLIC_WS_URL": "ws://backend:8000"
                  },
                  "waitForConditions": [
                    {
                      "serviceRef": "backend",
                      "condition": "running"
                    }
                  ]
                }
              }
            ]
          }
        }
      ]
    }
  }
}
